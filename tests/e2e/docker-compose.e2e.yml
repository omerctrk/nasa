# Uçtan uca test yığını: asıl docker-compose.yml'nin ÜZERİNE uygulanır, ayrı proje adıyla (astra-e2e)
# çalışır → ayrı veritabanı volume'u, ayrı ağ. Asıl demo DB'sine ve 1433/8001 portlarına dokunmaz.
#
#   docker compose -p astra-e2e -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yml ...
# Yollar proje köküne göredir. Tek tık: tests/e2e/e2e_calistir.cmd

services:
  db:
    ports: !reset []          # host portu açma: asıl yığın 1433'ü kullanıyor olabilir

  api:
    ports: !reset []
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      # Ana aşama: boş → model çağrılmaz, deterministik. Model aşamalarında çalıştırıcı ayarlar.
      LLM_BASE_URL: ${E2E_LLM_BASE_URL:-}
      ANOMALY_REFERENCE_DATE: ""   # utc_now modu: bugünün verisiyle analiz
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 5s

  e2e:
    build: ./backend
    extra_hosts: ["host.docker.internal:host-gateway"]
    profiles: ["tools"]
    depends_on:
      api: { condition: service_healthy }
    environment:
      E2E_API_URL: http://api:8000
      E2E_RAPOR_DIR: /e2e/rapor
      E2E_PHASE: ${E2E_PHASE:-ana}
      E2E_JOB_TIMEOUT: ${E2E_JOB_TIMEOUT:-90}
      E2E_LLM_PROBE: ${E2E_LLM_PROBE:-}
      E2E_LLM_MODEL: ${LLM_MODEL:-qwen3:14b}
      SEED_ASTRONAUT_PASSWORD: ${SEED_ASTRONAUT_PASSWORD:?e2e parolası yok}
      SEED_GROUND_PASSWORD: ${SEED_GROUND_PASSWORD:?e2e parolası yok}
    volumes: ["./tests/e2e:/e2e"]
    command: ["python", "/e2e/senaryolar.py"]
